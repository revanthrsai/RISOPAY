spring.application.name=risopay
# Maximum permitted XML request size: 50 MB
risopay.api.max-xml-request-size=52428800
# Blank uses the JVM temporary directory. Configure a private application directory in production.
risopay.api.xml-staging-directory=
# Bounds the number of simultaneous temporary XML files.
risopay.api.max-concurrent-staged-xml-requests=16

spring.datasource.url=${RISOPAY_DB_URL:jdbc:postgresql://localhost:5432/risopay}
spring.datasource.username=${RISOPAY_DB_USERNAME:risopay}
spring.datasource.password=${RISOPAY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
